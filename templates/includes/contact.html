<section class="card-section" id="contact">

    <div class="container">

        <div class="text-center mb-5">

            <h2>
                Contact Us
            </h2>

            <p>
                Have a question or want to learn more?
                Send us a message.
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="glass-card">


                    <form method="POST" action="{% url 'contact' %}">

                        {% csrf_token %}


                        <!-- Name -->

                        <div class="mb-4">

                            <label for="home_name" class="form-label">
                                Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                id="home_name"
                                class="form-control"
                                placeholder="Your Name"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div class="mb-4">

                            <label for="home_email" class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="home_email"
                                class="form-control"
                                placeholder="Your Email"
                                required
                            >

                        </div>


                        <!-- Subject -->

                        <div class="mb-4">

                            <label for="home_subject" class="form-label">
                                Subject
                            </label>

                            <input
                                type="text"
                                name="subject"
                                id="home_subject"
                                class="form-control"
                                placeholder="Subject"
                                required
                            >

                        </div>


                        <!-- Message -->

                        <div class="mb-4">

                            <label for="home_message" class="form-label">
                                Message
                            </label>

                            <textarea
                                name="message"
                                id="home_message"
                                class="form-control"
                                placeholder="Your Message"
                                rows="6"
                                required
                            ></textarea>

                        </div>


                        <!-- Button -->

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn-primary"
                            >
                                Send Message
                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
